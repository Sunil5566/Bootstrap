<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
   <style>
      body {
         background-image: url("galyang.webp");
         display: flex;
         background-size: cover;
         background-repeat: no-repeat;
         height: 100vh;
         margin: 0%;
      }


      .LoginForm {
         height: 280px;
         width: 220px;
         background-color: rgb(7, 231, 175);
         margin-left: 53rem;
         margin-top: 6rem;
         border: 2px solid black;
         border-radius: 30px;
      }

      .LoginForm:hover {
         transform: scale(1.1);
         background-color: aquamarine;
      }

      #log {
         height: 30px;
         width: 90px;
         background-color: rgb(222, 205, 19);
      }

      #log:hover {
         background-color: rgb(26, 93, 237);
         transform: scale(1.1);
      }
   </style>
</head>

<body>

   <div class="LoginForm">
      <center>
         <h2> SignIn</h2>

         <form class="form1">User Name:</form>
         <input type="text" name="User"> <br> <br>
         <form class="form2">Password:</form>
         <input type="password"><br><br>
         <label for="Login"></label>
         <input type="Submit" id="log" value="Login">
   </div>






</body>

</html>
